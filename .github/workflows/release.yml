name: Android Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PappVersion=${GITHUB_REF_NAME#v}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: evhelper-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/evhelper-*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/evhelper-*.apk
          generate_release_notes: true